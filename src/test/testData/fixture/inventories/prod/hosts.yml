---
# Same nesting as stag, but no canary group and no group_vars/platform.yml.
#   all (0) -> platform (1) -> webservers (2)
all:
  children:
    platform:
      children:
        webservers:
          hosts:
            prod-web-1:
              ansible_host: 127.0.0.1
              ansible_connection: local
            prod-web-2:
              ansible_host: 127.0.0.1
              ansible_connection: local
