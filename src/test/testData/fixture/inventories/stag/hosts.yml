---
# Group graph (depth in parentheses):
#   all (0)
#   └── platform (1)
#       ├── webservers (2)
#       └── canary     (2, ansible_group_priority: 10)
#
# stag-web-1 is in BOTH depth-2 groups -> priority breaks the tie.
# stag-web-2 is only in webservers.
all:
  children:
    platform:
      children:
        webservers:
          hosts:
            stag-web-1:
              ansible_host: 127.0.0.1
              ansible_connection: local
            stag-web-2:
              ansible_host: 127.0.0.1
              ansible_connection: local
        canary:
          # ansible_group_priority MUST be set here, in the inventory source.
          # Setting it in group_vars/canary.yml is silently ignored, because
          # group_vars files are merged USING the priority that already exists
          # on the Group object.
          vars:
            ansible_group_priority: 10
          hosts:
            stag-web-1: {}
