---
- name: Deploy the demo application stack
  hosts: webservers
  gather_facts: true

  # NAV: vars_files entry -> ./vars/common.yml (relative to the playbook dir)
  vars_files:
    - vars/common.yml

  # VAR: play vars (precedence 13) — beaten by vars_files (15) and role vars (16)
  vars:
    app_name: yamlix-demo
    app_port: 8060
    deploy_user: deploy

  pre_tasks:
    - name: Report variables before any role has run
      ansible.builtin.debug:
        msg: >-
          PRE-ROLE host={{ inventory_hostname }}
          app_port={{ app_port }}
          app_workers={{ app_workers }}
          app_log_level={{ app_log_level }}
          app_url={{ app_url }}

  roles:
    # NAV: short name -> roles/app (first roles_path entry)
    - app
    # NAV: fully-qualified collection name ->
    #      collections/ansible_collections/acme/web/roles/proxy
    - acme.web.proxy
    # NAV: short name NOT under ./roles -> external-roles/legacy_backup
    #      (only reachable via the second roles_path entry)
    - legacy_backup

  post_tasks:
    - name: Report variables after all roles have run
      ansible.builtin.debug:
        msg: >-
          POST-ROLE host={{ inventory_hostname }}
          app_port={{ app_port }}
          app_url={{ app_url }}
