---
# NAV: F19 — no playbook runs this role, which is deliberate: it is the shape
# debops has everywhere, where the play that would prove the ordering is not
# in reach. `probe_status` is registered in collect.yml and read here. It is
# not defined anywhere as a value, and reporting it as "not defined in this
# project" is false: it exists, it just does not exist *yet*. The report must
# name the task that produces it instead.
- name: run the probe
  ansible.builtin.include_tasks: collect.yml

- name: report the probe status
  ansible.builtin.debug:
    msg: "probe said {{ probe_status.stdout }}"
