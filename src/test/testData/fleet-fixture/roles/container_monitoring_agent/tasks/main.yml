---
# NAV: `include_vars: "{{ item }}"` + `with_first_found:` — the value Ansible
# actually loads is a `with_first_found` entry, never the loop placeholder
# itself. See vars/env-<inventory>.yml for the files this reaches.
- name: include environment-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "env-{{ fleet_env }}.yml"
  tags: always

# NAV: `agent_image` resolves to *this* role's own defaults/main.yml, never
# roles/legacy_monitoring_agent's, even though both define a variable with the
# same name — the two roles are never in the same play.
- name: start container monitoring agent
  ansible.builtin.debug:
    msg: "start {{ agent_image }} using {{ artifact_repo.url }} (retain {{ retention_days }}d)"
