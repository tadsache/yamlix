---
# NAV: F20 — the caller. `probe_target` exists only here, and is read only
# inside the role this task includes.
- hosts: containers
  vars:
    probe_targets:
      - alpha
      - beta
  tasks:
    - name: Probe every target
      ansible.builtin.include_role:
        name: loop_probe_agent
      loop: "{{ probe_targets }}"
      loop_control:
        loop_var: probe_target
