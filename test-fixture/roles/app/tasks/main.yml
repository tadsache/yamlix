---
- name: Load OS-family specific vars
  # NAV: fact-templated filename. Candidates are roles/app/vars/*.yml
  # (include_vars searches the role's vars/ then files/ directory).
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Report resolved variables inside role app
  ansible.builtin.debug:
    msg: >-
      ROLE-APP host={{ inventory_hostname }}
      app_port={{ app_port }}
      app_workers={{ app_workers }}
      app_url={{ app_url }}
      app_pkg_manager={{ app_pkg_manager }}

- name: Render the application config
  ansible.builtin.template:
    src: app.conf.j2
    dest: "{{ app_config_path }}"
    mode: "0644"
  register: app_config
  notify: Restart app

- name: Report the registered variable
  ansible.builtin.debug:
    msg: >-
      REGISTERED changed={{ app_config.changed }}
      dest={{ app_config.dest }}

- name: Pin the debug port on staging only
  # VAR: set_fact (precedence 20) overrides even include_vars, but only
  # where the when: holds. Static analysis cannot evaluate the guard.
  ansible.builtin.set_fact:
    app_port: 8500
  when: app_env == 'stag'

- name: Include the configure sub-tasks
  # NAV: relative include_tasks -> roles/app/tasks/configure.yml
  ansible.builtin.include_tasks: configure.yml

- name: Run the monitoring role dynamically
  # NAV: include_role short name -> roles/monitoring
  ansible.builtin.include_role:
    name: monitoring
  vars:
    monitoring_source: app
