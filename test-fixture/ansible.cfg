[defaults]
# Two roots, in order. A short role name is searched here left-to-right,
# then in the playbook-adjacent ./roles, then in the playbook dir itself.
roles_path = ./roles:./external-roles

# Default inventory when -i is not passed.
inventory = ./inventories/stag

# The in-repo collection root that makes acme.web.proxy resolvable.
collections_path = ./collections

host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
