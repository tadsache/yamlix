name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The Plugin Verifier's answer changes when JetBrains ships a new IDE, not
  # when this repository changes. Without a scheduled run the first sign of an
  # incompatibility is a user's bug report.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The fixtures under src/test/testData are the specification: the
      # navigation and resolution tables in docs/ were produced by running
      # real Ansible against them, and the tests assert the plugin agrees.
      - name: Test
        run: ./gradlew test --no-configuration-cache

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `pluginVerification { ides { ... } }` in build.gradle.kts resolves the
      # IDE set — `recommended()` plus Ultimate, PyCharm and GoLand — so this
      # widens automatically as JetBrains ships releases. The plugin depends
      # only on the platform and bundled YAML, so the Marketplace offers it to
      # every JetBrains IDE; verifying against one would make that claim wider
      # than anything checked. The plugin also declares no upper build bound and
      # uses several experimental APIs; this job is what makes all of that
      # honest rather than optimistic.
      - name: Plugin Verifier
        run: ./gradlew verifyPlugin --no-configuration-cache

      - name: Publish verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

  package:
    needs: [test, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: yamlix-plugin
          path: build/distributions/*.zip

  # Tagging is the release. The job runs only on a `v*` tag, and only after the
  # tests and the Plugin Verifier have both passed on that exact commit.
  #
  # `environment: marketplace` is the stop button: give that environment a
  # required reviewer in the repository settings and a tag waits for a human
  # before anything reaches the Marketplace. Without a reviewer configured it
  # publishes straight through, which is a decision, not an accident.
  release:
    needs: [test, verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag and gradle.properties must agree, or the Marketplace ends up
      # holding a version nobody can check out. Catching it here costs seconds;
      # catching it after publication costs a version number, since the
      # Marketplace will not let the same one be uploaded twice.
      - name: Check the tag matches pluginVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')"
          if [ "$tag" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag, gradle.properties says $declared." >&2
            exit 1
          fi

      # The build takes the key and chain as files rather than as PEM text —
      # passing the chain as a string makes verifyPluginSignature build a
      # command line carrying the certificate twice, and the CLI rejects it with
      # a usage error that names nothing. RUNNER_TEMP is wiped with the runner.
      - name: Materialise the signing key
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s\n' "$CERTIFICATE_CHAIN" > "$dir/chain.crt"
          printf '%s\n' "$PRIVATE_KEY" > "$dir/private.pem"
          chmod 600 "$dir"/*
          echo "CERTIFICATE_CHAIN_FILE=$dir/chain.crt" >> "$GITHUB_ENV"
          echo "PRIVATE_KEY_FILE=$dir/private.pem" >> "$GITHUB_ENV"

      # signPlugin runs as a dependency of publishPlugin; naming it here means a
      # signing failure reports as a signing failure rather than as a publish
      # one. PRIVATE_KEY_PASSWORD is only needed for an encrypted key, and is
      # harmless when the secret does not exist.
      - name: Sign plugin
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin --no-configuration-cache

      # signPlugin succeeds on a chain that the Marketplace will then reject.
      # This checks the artifact rather than the exit code, so a bad certificate
      # fails here instead of consuming the version number upstream.
      - name: Verify the signature
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew verifyPluginSignature --no-configuration-cache

      - name: Publish to the JetBrains Marketplace
        env:
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-configuration-cache

      # The signed zip, not the unsigned one from `package` — what lands on the
      # release is then the same artifact the Marketplace received, so someone
      # sideloading it gets a build with a verifiable origin.
      #
      # Still a draft: the Marketplace holds the version for its own review
      # anyway, so there is nothing to gain from announcing it before that
      # clears.
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: build/distributions/*-signed.zip
          body_path: CHANGELOG.md
