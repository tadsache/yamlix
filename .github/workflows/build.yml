name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The Plugin Verifier's answer changes when JetBrains ships a new IDE, not
  # when this repository changes. Without a scheduled run the first sign of an
  # incompatibility is a user's bug report.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The fixtures are the specification, and a test asserts that
      # src/test/testData stays byte-identical to them — so this also proves
      # the spec and the code have not drifted apart.
      - name: Test
        run: ./gradlew test --no-configuration-cache

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # `pluginVerification { ides { recommended() } }` in build.gradle.kts
      # resolves the IDE set, so this widens automatically as JetBrains ships
      # releases. The plugin declares no upper build bound and uses several
      # experimental APIs; this job is what makes that honest rather than
      # optimistic.
      - name: Plugin Verifier
        run: ./gradlew verifyPlugin --no-configuration-cache

      - name: Publish verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

  package:
    needs: [test, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-configuration-cache

      - uses: actions/upload-artifact@v4
        with:
          name: yamlix-plugin
          path: build/distributions/*.zip

      # Tagging is the release. Publishing to the Marketplace stays manual
      # until a token is configured, so a tag can never push something nobody
      # looked at.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: build/distributions/*.zip
          body_path: CHANGELOG.md
