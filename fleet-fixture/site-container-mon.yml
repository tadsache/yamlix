---
# NAV: `hostgroup: containers` here should resolve as a group reference too —
# it flows into shared/noop.yml's `hosts: "{{ hostgroup | default('all') }}"`
# convention elsewhere in the real project. (This fixture's noop.yml uses
# `hosts: all` directly, but the `vars:` value itself must still resolve.)
- import_playbook: shared/noop.yml
  vars:
    hostgroup: containers

# NAV: `hosts: containers` matches exactly one host per environment (see
# inventories/*/hosts) — `container_monitoring_agent`'s vars must never be
# reported as applying to the *whole* inventory.
- hosts: containers
  roles:
    - container_monitoring_agent
